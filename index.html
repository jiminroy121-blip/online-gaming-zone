<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Gaming Zone</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10152b;
      color: white;
      text-align: center;
    }
    header { padding: 35px 15px; background: #222c55; }
    h1 { color: #61dafb; }
    main { padding: 30px 15px; }
    .games {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 18px;
    }
    .game {
      background: #222c55;
      padding: 25px;
      border-radius: 12px;
      width: 220px;
    }
    a {
      display: inline-block;
      background: #61dafb;
      color: #10152b;
      padding: 10px 18px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>🎮 Online Gaming Zone</h1>
    <p>Your place for fun browser games!</p>
  </header>
  <main>
    <h2>Choose Your Game</h2>
    <div class="games">
      <div class="game">
        <h3>Snake Game</h3>
        <p>Enjoy a classic gaming experience.</p>
        <a href="https://playsnake.org/">Play Now</a>
      </div>
      <div class="game">
        <h3>2048</h3>
        <p>Combine numbers and reach 2048.</p>
        <a href="https://play2048.co/">Play Now</a>
      </div>
      <div class="game">
        <h3>Chess</h3>
        <p>Challenge yourself with chess.</p>
        <a href="https://www.chess.com/play/computer">Play Now</a>
      </div>
    </div>
  </main>
</body>
</html>
